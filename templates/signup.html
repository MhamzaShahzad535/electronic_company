<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ElectroTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a73e8;
            --primary-light: #4285f4;
            --primary-dark: #0d47a1;
            --secondary: #e8f0fe;
            --accent: #34a853;
            --text-dark: #202124;
            --text-light: #f8f9fa;
            --white: #ffffff;
            --gray: #5f6368;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), 
                        url('https://images.unsplash.com/photo-1555774698-0b77e0d5fac6?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') no-repeat center center/cover;
        }
        
        .container {
            width: 50%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1;
        }
        
        .right-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }
        
        .right-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(26, 115, 232, 0.1), rgba(26, 115, 232, 0.1));
            z-index: -1;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-align: center;
        }
        
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            color: var(--gray);
            text-align: center;
            max-width: 400px;
        }
        
        .form-container {
            width: 100%;
            max-width: 400px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-field {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--secondary);
            color: var(--text-dark);
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-light);
        }
        
        .register-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .register-btn:hover {
            background-color: var(--primary-dark);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray);
        }
        
        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .login-link a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        
        .tech-image {
            max-width: 80%;
            height: auto;
            border-radius: 15px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .tech-image:hover {
            transform: scale(1.02);
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        
        .feature i {
            color: var(--accent);
            font-size: 1.2rem;
        }
        
        @media (max-width: 992px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            
            .container, .right-panel {
                width: 100%;
                padding: 40px 20px;
            }
            
            .right-panel {
                order: -1;
                padding-top: 60px;
                padding-bottom: 40px;
            }
            
            .tech-image {
                max-width: 70%;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 30px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .tech-image {
                max-width: 90%;
            }
            
            .features {
                flex-direction: column;
                align-items: center;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="animated">Create Account</h1>
        <p class="subtitle animated delay-1">Join ElectroTech to access premium electronics components and services</p>
    
        <!-- Signup Form -->
        <form method="POST" action="{{ url_for('signup') }}" class="form-container">

            <div class="input-group animated delay-1">
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="input-field" name="username" placeholder="Username" required>
            </div>
            <div class="input-group animated delay-2">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" class="input-field" name="phone" placeholder="Phone Number" required>
            </div>
            <div class="input-group animated delay-2">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" class="input-field" name="email" placeholder="Email Address" required>
            </div>
            <div class="input-group animated delay-3">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="input-field" name="password" placeholder="Password" required>
            </div>
            <div class="input-group animated delay-3">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="input-field" name="confirm_password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="register-btn animated delay-4">Register Now</button>
    
            <p class="login-link animated delay-4">
                Already have an account? <a href="login">Sign in</a>
            </p>
        </form>
    </div>
    
    <div class="right-panel">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80" alt="Electronics components" class="tech-image animated">
        
        <div class="features animated delay-2">
            <div class="feature">
                <i class="fas fa-microchip"></i>
                <span>Premium components</span>
            </div>
            <div class="feature">
                <i class="fas fa-headset"></i>
                <span>Expert support</span>
            </div>
            <div class="feature">
                <i class="fas fa-shield-alt"></i>
                <span>Secure transactions</span>
            </div>
        </div>
    </div>
</body>
</html>
